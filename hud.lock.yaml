tools:
- name: context
  description: Get a full textual summary of the current factory graph, state, and
    actions.
  inputSchema:
    properties: {}
    type: object
- name: state
  description: Get the current structured state of the factory (balance, revenue,
    inventory).
  inputSchema:
    properties: {}
    type: object
- name: graph
  description: Get the raw dependency graph for the factory (nodes + links).
  inputSchema:
    properties: {}
    type: object
- name: buy
  description: Buy raw materials using the factory balance.
  inputSchema:
    properties:
      material_name:
        title: Material Name
        type: string
      quantity:
        title: Quantity
        type: integer
    required:
    - material_name
    - quantity
    type: object
- name: craft
  description: Craft a product from available inventory materials.
  inputSchema:
    properties:
      product_name:
        title: Product Name
        type: string
      quantity:
        title: Quantity
        type: integer
    required:
    - product_name
    - quantity
    type: object
- name: sell
  description: Sell a crafted product to earn revenue.
  inputSchema:
    properties:
      product_name:
        title: Product Name
        type: string
      quantity:
        title: Quantity
        type: integer
    required:
    - product_name
    - quantity
    type: object
- name: reset
  description: Reset the factory environment to its initial state.
  inputSchema:
    properties: {}
    type: object
- name: evaluate
  description: Evaluate how close the factory is to the target revenue.
  inputSchema:
    properties:
      target_revenue:
        default: 500.0
        title: Target Revenue
        type: number
    type: object
